# XcodeGen spec. This is an OPTIONAL way to regenerate UsageAI.xcodeproj from
# scratch (`brew install xcodegen && xcodegen generate`). The committed
# .xcodeproj already works without it — this is here as a maintainable source of
# truth if you'd rather not hand-edit the pbxproj.
name: UsageAI
options:
  bundleIdPrefix: fyi.jono
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  UsageAI:
    type: application
    platform: iOS
    sources:
      - UsageAI
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fyi.jono.UsageAI
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_ENTITLEMENTS: UsageAI/UsageAI.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: true
    dependencies:
      - target: UsageAIWidgetExtension
  UsageAIWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - UsageAIWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fyi.jono.UsageAI.widget
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: UsageAIWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: UsageAIWidget/UsageAIWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "Usage AI"
